import groovy.json.JsonSlurper

plugins {
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'maven-publish'
}

def manifest = new JsonSlurper().parse(file('versions/manifest.json'))
def mcsProfileFromCli = gradle.startParameter.projectProperties.containsKey('mcs_profile')
def activeProfileName = findProperty('mcs_profile') ?: '1.21.11'
def activeProfile = manifest.profiles[activeProfileName]
if (activeProfile == null) {
    throw new GradleException("Unknown mcs_profile '${activeProfileName}'. See versions/manifest.json")
}

ext {
    mcsProfileName = activeProfileName
    if (mcsProfileFromCli) {
        minecraft_version = activeProfile.minecraft_version
        mcsMinecraftProfile = activeProfile.mcs_profile
        supportedGameVersions = (activeProfile.supported_game_versions as List).join(',')
        fabric_loader_version = activeProfile.fabric_loader_version
        fabric_api_version = activeProfile.fabric_api_version
        forge_version = activeProfile.forge_version
        neoforge_version = activeProfile.neoforge_version
        architectury_api_version = activeProfile.architectury_api_version
    } else {
        minecraft_version = findProperty('minecraft_version')
        mcsMinecraftProfile = findProperty('mcs_minecraft_profile')
        supportedGameVersions = findProperty('supported_game_versions')
        fabric_loader_version = findProperty('fabric_loader_version')
        fabric_api_version = findProperty('fabric_api_version')
        forge_version = findProperty('forge_version')
        neoforge_version = findProperty('neoforge_version')
        architectury_api_version = findProperty('architectury_api_version')
    }
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }

    base {
        archivesName = "${rootProject.archives_base_name}-${rootProject.mcsProfileName}-${project.name}"
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }
}

architectury {
    minecraft = rootProject.minecraft_version
}

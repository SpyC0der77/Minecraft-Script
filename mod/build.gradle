    "1.21.4": "1.21.4-54.1.16",
    "1.21.5": "1.21.5-55.1.10",
    "1.21.6": "1.21.6-56.0.4",
    "1.21.7": "1.21.7-57.0.3",
    "1.21.8": "1.21.8-58.1.18",
    "1.21.9": "1.21.9-59.0.5",
    "1.21.10": "1.21.10-60.1.9",

def usesPermissionSetApi = {
    def version = rootProject.minecraft_version
    if (version ==~ /^(?:2[6-9]|[3-9]\d*)\..+/) {
        return true
    }
    def match = (version =~ /^1\.21\.(\d+)/)
    if (match.matches()) {
        return match[0][1].toInteger() >= 11
    }
    return false
}()

sourceSets {
    main {
        java {
            srcDir usesPermissionSetApi ? 'src/modern/java' : 'src/legacy/java'
        }
    }
}

architectury {
    common rootProject.enabled_platforms.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
}

def generatedResourcesDir = layout.buildDirectory.dir('generated/resources/main')

sourceSets.main.resources.srcDir(generatedResourcesDir)

tasks.register('syncMcsVersions', Copy) {
    from rootProject.file('../minecraft_script/versions/index.json')
    into generatedResourcesDir
    rename { 'mcs-versions.json' }
}

tasks.register('syncStarterPack', Copy) {
    from rootProject.file('../examples/starter_datapack.mcs')
    into generatedResourcesDir.map { it.dir('starter') }
    rename { 'pack.mcs' }
}

processResources.dependsOn syncMcsVersions, syncStarterPack

dependencies {
    modImplementation "dev.architectury:architectury:${rootProject.architectury_api_version}"
    implementation 'com.google.code.gson:gson:2.11.0'
}

def spyglassSourceScript = file("${rootProject.projectDir}/scripts/mcs-spyglass-validate.mjs")
def spyglassBundledScript = layout.buildDirectory.file('generated/resources/main/scripts/mcs-spyglass-validate.js')

tasks.register('bundleSpyglassScript') {
    onlyIf { spyglassSourceScript.exists() }
    inputs.file(spyglassSourceScript)
    inputs.file("${rootProject.projectDir}/scripts/package.json")
    inputs.file("${rootProject.projectDir}/scripts/bun.lock")
    outputs.file(spyglassBundledScript.get().asFile)

    doLast {
        def scriptsDir = file("${rootProject.projectDir}/scripts")
        def bunAvailable = providers.exec {
            workingDir scriptsDir
            commandLine 'bun', '--version'
            ignoreExitValue true
        }.result.get().exitValue == 0

        exec {
            workingDir scriptsDir
            if (bunAvailable) {
                commandLine 'bun', 'run', 'bundle:spyglass'
            } else {
                commandLine 'npx', '--yes', 'esbuild@0.25.5', 'mcs-spyglass-validate.mjs',
                        '--bundle', '--platform=node', '--format=cjs', '--packages=bundle',
                        "--outfile=${spyglassBundledScript.get().asFile}",
                        '--banner:js=#!/usr/bin/env node'
            }
        }
    }
}

processResources {
    dependsOn tasks.named('bundleSpyglassScript')
    inputs.property 'mod_version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'mcs_profile', rootProject.mcsProfileName
    inputs.property 'mcs_minecraft_profile', rootProject.mcsMinecraftProfile
    inputs.property 'supported_game_versions', rootProject.supportedGameVersions

    filesMatching('fabric.mod.json') {
        expand 'mod_version': project.version,
                'minecraft_version': rootProject.minecraft_version,
                'supported_game_versions': rootProject.supportedGameVersions
    }
    filesMatching('META-INF/mods.toml') {
        expand 'mod_version': project.version,
                'minecraft_version': rootProject.minecraft_version,
                'supported_game_versions': rootProject.supportedGameVersions
    }
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_version': project.version,
                'minecraft_version': rootProject.minecraft_version,
                'supported_game_versions': rootProject.supportedGameVersions
    }
}

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'mcs-packs'

def properties = new Properties()
def propertiesFile = file('gradle.properties')
if (propertiesFile.exists()) {
    propertiesFile.withInputStream { properties.load(it) }
}

def enabledPlatformsProperty = gradle.startParameter.projectProperties.get('enabled_platforms')
if (enabledPlatformsProperty == null) {
    enabledPlatformsProperty = properties.getProperty('enabled_platforms', 'fabric,forge,neoforge')
}

def enabledPlatforms = (enabledPlatformsProperty ?: 'fabric,forge,neoforge')
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }

include 'common'
if (enabledPlatforms.contains('fabric')) {
    include 'fabric'
}
if (enabledPlatforms.contains('forge')) {
    include 'forge'
}
if (enabledPlatforms.contains('neoforge')) {
    include 'neoforge'
}

modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/SpyC0der77/Minecraft-Script/issues"

[[mods]]
modId = "mcs_packs"
version = "${mod_version}"
displayName = "MCS Packs"
description = "Compile and hot-reload Minecraft Script datapacks from mcs_packs/"
authors = "SpyC0der77"

[[dependencies.mcs_packs]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},${neoforge_version_upper})"
ordering = "NONE"
side = "BOTH"

[[dependencies.mcs_packs]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},${minecraft_version_upper})"
ordering = "NONE"
side = "BOTH"

[[dependencies.mcs_packs]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},${architectury_api_version_upper})"
ordering = "AFTER"
side = "BOTH"

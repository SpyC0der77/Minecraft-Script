plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

loom {
    neoForge {
        version = rootProject.neoforge_version
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

def stripPreReleaseSuffix = { String version ->
    version.replaceFirst(/-(?:beta|alpha|rc\d*|snapshot|pre).*$/, '')
}

def warnVersionFallback = { String name, String version, String reason, String safeUpper ->
    logger.warn("Using fallback upper bound for ${name} '${version}': ${reason}. Using '${safeUpper}'")
    safeUpper
}

def nextMinecraftVersion = {
    def version = stripPreReleaseSuffix(rootProject.minecraft_version)
    def parts = version.tokenize('.')
    if (parts.size() == 2 && parts[0].isInteger() && parts[1].isInteger() && parts[0].toInteger() >= 26) {
        return "${parts[0]}.${parts[1].toInteger() + 1}"
    }
    if (parts.size() == 3 && parts.every { it.isInteger() }) {
        return "${parts[0]}.${parts[1]}.${parts[2].toInteger() + 1}"
    }
    warnVersionFallback('minecraft_version', rootProject.minecraft_version, "unrecognized format after normalization '${version}'", '99.99.99')
}()

def nextMajorVersion = { String version, String suffix = '', String name = 'version', String safeUpper = '99.0.0' ->
    def normalized = stripPreReleaseSuffix(version)
    def major = normalized.tokenize('.')[0]
    if (major.isInteger()) {
        return "${major.toInteger() + 1}${suffix}"
    }
    warnVersionFallback(name, version, "unrecognized major component '${major}'", safeUpper)
}

def nextNeoForgeVersion = nextMajorVersion(rootProject.neoforge_version, '.0.0-beta', 'neoforge_version', '99.0.0-beta')
def nextArchitecturyVersion = nextMajorVersion(rootProject.architectury_api_version, '.0.0', 'architectury_api_version', '99.0.0')

processResources {
    inputs.property 'mod_version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'supported_game_versions', rootProject.supportedGameVersions
    inputs.property 'neoforge_version', rootProject.neoforge_version
    inputs.property 'architectury_api_version', rootProject.architectury_api_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_version': project.version,
                'minecraft_version': rootProject.minecraft_version,
                'neoforge_version': rootProject.neoforge_version,
                'minecraft_version_upper': nextMinecraftVersion,
                'neoforge_version_upper': nextNeoForgeVersion,
                'architectury_api_version': rootProject.architectury_api_version,
                'architectury_api_version_upper': nextArchitecturyVersion,
                'supported_game_versions': rootProject.supportedGameVersions
    }
}

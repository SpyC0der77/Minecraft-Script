plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

loom {
    neoForge {
        version = rootProject.neoforge_version
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

def nextMinecraftVersion = {
    def version = rootProject.minecraft_version
    def modern = (version =~ /^2[6-9]\.(\d+)$/)
    if (modern.matches()) {
        return "${modern[0][0].split('\\.')[0]}.${modern[0][1].toInteger() + 1}"
    }
    def release = (version =~ /^(\d+)\.(\d+)\.(\d+)$/)
    if (release.matches()) {
        return "${release[0][1]}.${release[0][2]}.${release[0][3].toInteger() + 1}"
    }
    return version
}()

def nextNeoForgeVersion = {
    def version = rootProject.neoforge_version
    def match = (version =~ /^(\d+)\./)
    return match.matches() ? "${match[0][1].toInteger() + 1}.0.0-beta" : version
}()

def nextArchitecturyVersion = {
    def version = rootProject.architectury_api_version
    def match = (version =~ /^(\d+)\./)
    return match.matches() ? "${match[0][1].toInteger() + 1}.0.0" : version
}()

processResources {
    inputs.property 'mod_version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'supported_game_versions', rootProject.supportedGameVersions
    inputs.property 'neoforge_version', rootProject.neoforge_version
    inputs.property 'architectury_api_version', rootProject.architectury_api_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_version': project.version,
                'minecraft_version': rootProject.minecraft_version,
                'neoforge_version': rootProject.neoforge_version,
                'minecraft_version_upper': nextMinecraftVersion,
                'neoforge_version_upper': nextNeoForgeVersion,
                'architectury_api_version': rootProject.architectury_api_version,
                'architectury_api_version_upper': nextArchitecturyVersion,
                'supported_game_versions': rootProject.supportedGameVersions
    }
}

plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

loom {
    neoForge {
        version = rootProject.neoforge_version
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

processResources {
    inputs.property 'mod_version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'supported_game_versions', rootProject.supportedGameVersions
    inputs.property 'neoforge_version', rootProject.neoforge_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_version': project.version,
                'minecraft_version': rootProject.minecraft_version,
                'neoforge_version': rootProject.neoforge_version,
                'supported_game_versions': rootProject.supportedGameVersions
    }
}

plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

loom {
    forge {
        mixinConfig 'mcs_packs.mixins.json'
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionForge')) { transitive false }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

def nextMinecraftVersion = {
    def version = rootProject.minecraft_version
    def modern = (version =~ /^2[6-9]\.(\d+)$/)
    if (modern.matches()) {
        return "${modern[0][0].split('\\.')[0]}.${modern[0][1].toInteger() + 1}"
    }
    def release = (version =~ /^(\d+)\.(\d+)\.(\d+)$/)
    if (release.matches()) {
        return "${release[0][1]}.${release[0][2]}.${release[0][3].toInteger() + 1}"
    }
    return version
}()

def nextMajorVersion = { String version, String suffix = '' ->
    def major = version.tokenize('.')[0]
    major.isInteger() ? "${major.toInteger() + 1}${suffix}" : version
}

def nextForgeVersion = nextMajorVersion(rootProject.forge_version, '.0.0')
def nextArchitecturyVersion = nextMajorVersion(rootProject.architectury_api_version, '.0.0')

processResources {
    inputs.property 'mod_version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'supported_game_versions', rootProject.supportedGameVersions
    inputs.property 'forge_version', rootProject.forge_version
    inputs.property 'architectury_api_version', rootProject.architectury_api_version
    filesMatching('META-INF/mods.toml') {
        expand 'mod_version': project.version,
                'minecraft_version': rootProject.minecraft_version,
                'forge_version': rootProject.forge_version,
                'minecraft_version_upper': nextMinecraftVersion,
                'forge_version_upper': nextForgeVersion,
                'architectury_api_version': rootProject.architectury_api_version,
                'architectury_api_version_upper': nextArchitecturyVersion,
                'supported_game_versions': rootProject.supportedGameVersions
    }
}
